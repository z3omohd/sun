<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Financial & Elliptical Astronomical Calendar</title>
 <script src="https://cdn.tailwindcss.com"></script>
 <style>
 @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
 body {
 font-family: 'Inter', sans-serif;
 background-color: #0b0f19;
 }
 .orbit-earth-group {
 transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
 }
 </style>
</head>
<body class="bg-[#0b0f19] text-white flex justify-center items-center min-h-screen p-4">

 <div class="bg-gradient-to-br from-[#131c2e] to-[#0d1322] border border-white/10 rounded-3xl w-full max-w-md p-6 shadow-2xl relative overflow-hidden">
 
 <!-- Ambient decorative background glow effects -->
 <div class="absolute -top-24 -right-24 w-48 h-48 bg-blue-500/10 rounded-full blur-3xl pointer-events-none"></div>
 <div class="absolute -bottom-24 -left-24 w-48 h-48 bg-amber-500/10 rounded-full blur-3xl pointer-events-none"></div>

 <div class="flex justify-between items-center mb-5">
 <div class="flex items-center gap-2.5">
 <h2 id="monthName" class="text-xl font-bold text-sky-400 tracking-tight">September</h2>
 <span id="yearName" class="text-sm font-medium text-slate-400 bg-white/5 px-2.5 py-0.5 rounded-full border border-white/5">2026</span>
 </div>
 <div class="flex items-center gap-2">
 <button id="prevBtn" aria-label="Previous Month" class="w-9 h-9 flex items-center justify-center bg-white/5 hover:bg-sky-500/20 border border-white/10 hover:border-sky-500/40 text-white rounded-xl transition-all duration-200 cursor-pointer">
 <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
 </button>
 <button id="nextBtn" aria-label="Next Month" class="w-9 h-9 flex items-center justify-center bg-white/5 hover:bg-sky-500/20 border border-white/10 hover:border-sky-500/40 text-white rounded-xl transition-all duration-200 cursor-pointer">
 <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
 </button>
 <button id="todayBtn" class="px-3.5 py-2 bg-white/5 hover:bg-sky-500/20 border border-white/10 hover:border-sky-500/40 text-white font-medium text-xs rounded-xl transition-all duration-200 cursor-pointer">
 Today
 </button>
 </div>
 </div>

 <div class="bg-black/30 border border-white/10 rounded-2xl p-4 mb-5 relative">
 <div class="flex justify-between items-center mb-3">
 <div class="flex items-center gap-2 text-amber-400 text-xs font-semibold tracking-wider uppercase">
 <span class="inline-block w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
 <span>Elliptical Solar Orbit Model</span>
 </div>
 <span id="dayOfYearText" class="text-[11px] font-medium text-slate-400 bg-white/5 px-2.5 py-0.5 rounded-lg border border-white/5">Day 263</span>
 </div>
 
 <!-- Elliptical Orbit Graphic Container (Added z-20 to prevent overlapping) -->
 <div class="relative w-full h-36 flex items-center justify-center my-1 z-20">

 <svg class="w-full h-full" viewBox="0 0 320 130">
 <!-- Outer Elliptical Orbit Path (Center at 160, 65) -->
 <ellipse cx="160" cy="65" rx="135" ry="45" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" stroke-dasharray="4 4" />
 
 <!-- Orbital Axis Lines -->
 <line x1="160" y1="20" x2="160" y2="110" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
 <line x1="25" y1="65" x2="295" y2="65" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

 <!-- Sun at Center / Focus -->
 <g transform="translate(160, 65)">
 <circle r="12" fill="#fbbf24" filter="drop-shadow(0 0 8px rgba(251, 191, 36, 0.7))" />
 <circle r="6" fill="#fef08a" />
 </g>

 <!-- Solstices & Equinox Markers -->
 <!-- Summer Solstice (Cancer): Jun 21 at Top (160, 20) -->
 <g transform="translate(160, 20)">
 <circle r="5" fill="#f59e0b" opacity="0.8"/>
 <text x="14" y="3" fill="#fcd34d" font-size="8" font-weight="600" text-anchor="start">Jun 21</text>
 </g>
 <!-- Autumn Equinox: Sep 23 at Right (295, 65) -->
 <g transform="translate(295, 65)">
 <circle r="5" fill="#ea580c" opacity="0.8"/>
 <text x="0" y="20" fill="#fb923c" font-size="8" font-weight="600" text-anchor="middle">Sep 23</text>
 </g>
 <!-- Winter Solstice (Capricorn): Dec 22 at Bottom (160, 110) -->
 <g transform="translate(160, 110)">
 <circle r="5" fill="#2563eb" opacity="0.8"/>
 <text x="-14" y="3" fill="#60a5fa" font-size="8" font-weight="600" text-anchor="end">Dec 22</text>
 </g>
 <!-- Vernal Equinox: Mar 21 at Left (25, 65) -->
 <g transform="translate(25, 65)">
 <circle r="5" fill="#059669" opacity="0.8"/>
 <text x="0" y="20" fill="#34d399" font-size="8" font-weight="600" text-anchor="middle">Mar 21</text>
 </g>

 <!-- Dynamic Earth Orbit Marker -->
 <g id="dynamicEarth" class="orbit-earth-group" transform="translate(160, 20)">
 <circle r="8" fill="#38bdf8" stroke="#ffffff" stroke-width="2" filter="drop-shadow(0 0 6px rgba(56, 189, 248, 0.8))"/>
 <circle r="3" fill="#ffffff"/>
 </g>
 </svg>
 </div>

 <!-- Orbit Legend -->
 <div class="flex justify-around items-center text-[11px] text-slate-400 pt-2 border-t border-white/5">
 <div class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-orange-600"></span><span>Autumn</span></div>
 <div class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-blue-600"></span><span>Winter</span></div>
 <div class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-emerald-600"></span><span>Spring</span></div>
 <div class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-amber-500"></span><span>Summer</span></div>
 </div>
 </div>

 <div class="grid grid-cols-7 text-center text-xs font-semibold text-slate-400 mb-2">
 <div class="text-amber-400">Sun</div>
 <div>Mon</div>
 <div>Tue</div>
 <div>Wed</div>
 <div>Thu</div>
 <div>Fri</div>
 <div class="text-sky-400">Sat</div>
 </div>

 <div id="daysGrid" class="grid grid-cols-7 gap-1.5 text-center text-sm mb-5">
 <!-- Populated via JavaScript -->
 </div>

 <div class="bg-emerald-500/10 border border-emerald-500/20 rounded-2xl px-4 py-3 flex justify-between items-center">
 <div class="flex items-center gap-2.5">
 <span class="text-base"> </span>
 <div class="flex flex-col">
 <span class="text-xs font-semibold text-emerald-400">Salary Countdown</span>
 <span id="salaryCountdownText" class="text-sm font-bold text-emerald-300">Calculating...</span>
 </div>
 </div>
 <div class="text-right">
 <span class="text-[11px] font-medium text-slate-400 block">Payout Date</span>
 <span id="salaryDateText" class="text-xs font-semibold text-slate-200">Sep 27, 2026</span>
 </div>
 </div>

 </div>

 <script>
 let currentDate = new Date(); // Default starts with today
 const salaryDay = 27; // Fixed salary day each month
 const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

 const monthNameEl = document.getElementById('monthName');
 const yearNameEl = document.getElementById('yearName');
 const daysGridEl = document.getElementById('daysGrid');
 const salaryCountdownTextEl = document.getElementById('salaryCountdownText');
 const salaryDateTextEl = document.getElementById('salaryDateText');
 const dayOfYearTextEl = document.getElementById('dayOfYearText');
 const dynamicEarthEl = document.getElementById('dynamicEarth');

 function updateEllipticalOrbit(date) {
 const year = date.getFullYear();
 const startOfYear = new Date(year, 0, 1);
 const diffTime = date - startOfYear;
 const dayOfYear = Math.floor(diffTime / (1000 * 60 * 60 * 24)) + 1;
 const isLeap = (year % 4 === 0 && year % 100 !== 0) || (year % 400 === 0);
 const totalDays = isLeap ? 366 : 365;

 dayOfYearTextEl.textContent = `Day ${dayOfYear} of ${year}`;

 // Updated Math: Summer Solstice (Cancer) is approx Day 172 (Jun 21) -> Top of ellipse (angle = -PI/2)
 const summerSolsticeDay = isLeap ? 173 : 172;
 const dayOffset = dayOfYear - summerSolsticeDay;
 const angle = -Math.PI / 2 + (dayOffset / totalDays) * 2 * Math.PI;

 // Ellipse center (160, 65) with rx = 135, ry = 45
 const cx = 160;
 const cy = 65;
 const rx = 135;
 const ry = 45;

 const x = cx + rx * Math.cos(angle);
 const y = cy + ry * Math.sin(angle);

 // Update Earth SVG group position
 dynamicEarthEl.setAttribute('transform', `translate(${x.toFixed(1)}, ${y.toFixed(1)})`);
 }

 function renderCalendar() {
 const year = currentDate.getFullYear();
 const month = currentDate.getMonth();

 monthNameEl.textContent = monthNames[month];
 yearNameEl.textContent = year;

 updateEllipticalOrbit(currentDate);

 salaryDateTextEl.textContent = `${monthNames[month].slice(0, 3)} ${salaryDay}, ${year}`;

 const currentDayNum = currentDate.getDate();
 const daysUntilSalary = salaryDay - currentDayNum;

 if (daysUntilSalary > 0) {
 salaryCountdownTextEl.textContent = `${daysUntilSalary} Day${daysUntilSalary > 1 ? 's' : ''} Remaining`;
 } else if (daysUntilSalary === 0) {
 salaryCountdownTextEl.textContent = `Salary Day is Today!`;
 } else {
 salaryCountdownTextEl.textContent = `Salary Deposited`;
 }

 daysGridEl.innerHTML = '';

 const firstDayIndex = new Date(year, month, 1).getDay();
 const totalDaysInMonth = new Date(year, month + 1, 0).getDate();
 const prevMonthDays = new Date(year, month, 0).getDate();

 for (let i = firstDayIndex - 1; i >= 0; i--) {
 const dayDiv = document.createElement('div');
 dayDiv.className = 'aspect-square flex items-center justify-center text-slate-600 font-medium rounded-xl';
 dayDiv.textContent = prevMonthDays - i;
 daysGridEl.appendChild(dayDiv);
 }

 for (let i = 1; i <= totalDaysInMonth; i++) {
 const dayDiv = document.createElement('div');
 dayDiv.className = 'aspect-square flex flex-col items-center justify-center rounded-2xl transition-all cursor-pointer font-medium text-slate-200 hover:bg-white/10';

 const isToday = (i === currentDayNum);
 const isSalary = (i === salaryDay);

 if (isToday) {
 dayDiv.className = 'aspect-square flex flex-col items-center justify-center bg-amber-500 text-slate-950 font-bold rounded-2xl shadow-lg shadow-amber-500/40 transform scale-105 ring-2 ring-amber-300';
 }

 if (isSalary) {
 dayDiv.className = 'aspect-square flex flex-col items-center justify-center bg-emerald-500 text-slate-950 font-bold rounded-2xl shadow-lg shadow-emerald-500/40 transform scale-105 ring-2 ring-emerald-300';
 }

 if (isToday && isSalary) {
 dayDiv.className = 'aspect-square flex flex-col items-center justify-center bg-gradient-to-r from-amber-400 to-emerald-400 text-slate-950 font-bold rounded-2xl shadow-lg shadow-emerald-500/40 transform scale-105 ring-2 ring-white';
 }

 let content = `<span>${i}</span>`;
 if (isSalary && !isToday) {
 content += `<span class="text-[9px] -mt-1"> </span>`;
 }
 dayDiv.innerHTML = content;

 dayDiv.addEventListener('click', () => {
 currentDate = new Date(year, month, i);
 renderCalendar();
 });

 daysGridEl.appendChild(dayDiv);
 }

 const totalCellsRendered = firstDayIndex + totalDaysInMonth;
 const remainingCells = totalCellsRendered <= 35 ? 35 - totalCellsRendered : 42 - totalCellsRendered;
 for (let i = 1; i <= remainingCells; i++) {
 const dayDiv = function() {
 const el = document.createElement('div');
 el.className = 'aspect-square flex items-center justify-center text-slate-600 font-medium rounded-xl';
 el.textContent = i;
 return el;
 }();
 daysGridEl.appendChild(dayDiv);
 }
 }

 document.getElementById('prevBtn').addEventListener('click', () => {
 currentDate.setMonth(currentDate.getMonth() - 1);
 renderCalendar();
 });

 document.getElementById('nextBtn').addEventListener('click', () => {
 currentDate.setMonth(currentDate.getMonth() + 1);
 renderCalendar.call();
 });

 document.getElementById('todayBtn').addEventListener('click', () => {
 currentDate = new Date();
 renderCalendar();
 });

 renderCalendar();
 </script>
</body>
</html>
